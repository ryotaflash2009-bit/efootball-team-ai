name: CI

# 目的: PR作成時とmainへのpush時に、型チェック・全Unit Test・Production Buildを自動実行する。
# - 実Supabaseへは一切接続しない。Unit TestはテストダブルまたはSupabase環境変数不足時の
#   安全なエラー(WorldDataUnavailableError)経路のみを検証し、Production Buildも
#   参照データを扱う全ルートが動的(force-dynamic)のためビルド時にSupabaseへもSQLiteへも
#   接続しない(Phase E、2026-09-18に既定値をsupabaseへ切替後もこの構造は変わらない。
#   実測: NEXT_PUBLIC_SUPABASE_*未設定でも`npm run build`が成功することを確認済み)。
# - Supabase書き込み・migration実行・shadow comparisonの実接続はここでは行わない。
# - WORLD_DATA_SOURCEはここでも設定しない(このworkflowの環境では常に未設定のまま、
#   コード側の既定値がそのまま使われる。実Supabase環境変数も渡さないため、参照データの
#   Supabase経路を呼び出すテストは安全なエラーで終わる設計になっている)。
# - secretsはこのworkflowへ一切渡さない。

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # ローカル開発・これまでの全検証で実際に使用しているバージョン系列に合わせる
          # (package.jsonにenginesの指定なし、.nvmrcなし。Next.js 15.5の要件は満たす)。
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

      # 2026-09-21追記: 初回Production backup workflow run #1が、Backup処理を一切
      # 開始する前に「ReferenceError: exports is not defined in ES module scope」
      # (repository package.jsonが"type": "module"のため、tsconfig.backup-execution.json
      # (module: CommonJS)が生成した.jsがES Moduleとして誤解釈された)で失敗した。
      # `npx tsc --noEmit`/`npx vitest run`/`npm run build`はいずれもこの実行時
      # module-system不一致を検出できない(compile成功後の、実Node実行時にだけ
      # 顕在化する問題のため)。このステップは、実Secretを一切渡さずに
      # (このworkflowの既存方針どおり)実際にcompile→node実行まで行い、
      # 「module読み込みに成功し、Secret不足で安全にblockedになる」ことを
      # 毎回のPRで検証する回帰テスト。
      - name: "Backup execution module-format smoke test (no secrets; regression test for the 2026-09-21 initial run failure)"
        run: |
          npx tsc -p tsconfig.backup-execution.json
          set +e
          output=$(node scripts/run-production-backup-entry.mjs 2>&1)
          code=$?
          set -e
          echo "$output"
          if echo "$output" | grep -qiE "is not defined in ES module scope|Cannot find module|ERR_MODULE_NOT_FOUND|require is not defined"; then
            echo "::error::compiled backup execution entrypoint failed to load (module-system mismatch reintroduced)"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "::error::backup execution entrypoint should have blocked without secrets, but exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "必須環境変数が不足している"; then
            echo "::error::expected a missing-secret blocked message, got something else"
            exit 1
          fi
          echo "backup execution module loaded correctly and blocked safely before any DB/R2 connection"

  reference-data-postgres-validation:
    # 参照データ自動更新 Phase 2 の、実PostgreSQL(GitHub-hosted Ubuntuランナー上の
    # service container、このジョブの間だけ存在しジョブ終了後に破棄される)に対する
    # 隔離検証。定期実行(schedule)ではない。実Supabase・実Productionへは一切接続しない。
    # GitHub Secretsは使用せず、ここに書かれている資格情報はこのジョブ専用の使い捨て値。
    name: Reference data PostgreSQL validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phase2_test_user
          POSTGRES_PASSWORD: phase2_test_password_ci_only
          POSTGRES_DB: phase2_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: PostgreSQL Phase 2 validation (isolated service container)
        run: npx vitest run --config vitest.postgres.config.ts
        env:
          PHASE2_TEST_PG_HOST: localhost
          PHASE2_TEST_PG_PORT: "5432"
          PHASE2_TEST_PG_USER: phase2_test_user
          PHASE2_TEST_PG_PASSWORD: phase2_test_password_ci_only
          PHASE2_TEST_PG_DATABASE: phase2_test_db
