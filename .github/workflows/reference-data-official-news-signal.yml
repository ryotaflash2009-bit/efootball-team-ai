name: Reference data official news signal

# 公式のお知らせを「新しいデータが出た合図」として使う（2026-10-15・本人の承認）。
# - 6 時間に 1 回、eFootball 公式のお知らせの一覧へ GET 1 回（20 秒で打ち切り）。データに関わるお知らせから 3 日たっても
#   TeamAIXI に反映済みの最も新しいカード（applied-state）がそれより古ければ、参照データの通知の Issue にコメントする（1 日に 1 回まで）。
# - Secret・Environment・Production には触れない。GITHUB_TOKEN（issues: write）だけ。自動では何も適用しない。
# - 判断の記録: docs/production-readiness/official-news-signal.md

on:
  schedule:
    - cron: "29 */6 * * *"   # 6 時間ごとの 29 分（検出の 17 分・watchdog の 43 分と重ならない）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: reference-data-official-news-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the official news against the applied reference data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/official-news-signal.mjs
