name: Reference data Production backup (manual, approval-gated)

# ============================================================================
# 2026-09-21: execution steps implemented. This workflow has NEVER been run
# (no workflow_dispatch execution exists in this repository's Actions history
# as of this commit). This session did not connect to Production, did not
# connect to R2, and did not execute `age`.
# ============================================================================
#
# Trigger: workflow_dispatch ONLY. No `schedule:`, no `pull_request:`, no `push:`.
# A human must open the Actions tab and click "Run workflow" for this to ever start.
#
# GitHub Environment approval (`production-backup-approval`) is a SEPARATE, required
# gate configured in repository settings, not something this file can weaken or skip.
# No flag anywhere in this job substitutes for that human approval step. Secrets
# declared at job level are only exposed to the runner after that approval, per
# GitHub's own Environment protection semantics — this file cannot read them earlier.
#
# The job still fails fast, before any DB/R2 connection, if any of the seven required
# secrets (REFERENCE_DATA_BACKUP_DB_URL, REFERENCE_DATA_BACKUP_DB_CA_CERT,
# REFERENCE_DATA_BACKUP_AGE_RECIPIENT, REFERENCE_DATA_BACKUP_R2_ACCESS_KEY_ID,
# REFERENCE_DATA_BACKUP_R2_SECRET_ACCESS_KEY, REFERENCE_DATA_BACKUP_R2_ENDPOINT,
# REFERENCE_DATA_BACKUP_R2_BUCKET) is missing.
#
# TLS to Production PostgreSQL (2026-09-21 added, after workflow run #2 failed with
# "self-signed certificate in certificate chain"): REFERENCE_DATA_BACKUP_DB_CA_CERT
# holds the Supabase Server root certificate (PEM). It is passed to the pg client as
# `ssl.ca` so the certificate chain can be verified explicitly, alongside a fixed
# `ssl.rejectUnauthorized: true`. TLS verification is never disabled in this workflow
# and this Secret's value is never echoed, logged, or written to any file/artifact —
# see src/lib/reference-data/auto-update/backup-db-connection.ts for the full design.
#
# Storage destination: Cloudflare R2 (S3-compatible, SigV4). This job never installs
# or calls `@aws-sdk/client-s3`; the SigV4 signing and R2 REST calls are implemented
# directly in this repository (src/lib/reference-data/auto-update/backup-r2-sigv4.ts,
# backup-r2-real-client.ts) using only Node's built-in crypto/fetch, to avoid adding
# a large dependency for five well-documented REST operations.
#
# Encryption: `age` (installed on the runner below, not an npm package). The job
# only ever holds the age **public** recipient (REFERENCE_DATA_BACKUP_AGE_RECIPIENT);
# the private key never leaves the human's own machine and is never referenced here.
#
# Restore verification without the private key: this job cannot decrypt the real
# uploaded artifact (it has no private key). Instead it separately re-encrypts the
# exact same exported dataset with a one-time, in-memory-only ephemeral test key
# (generated fresh every run, discarded at job end, never logged, never a Secret)
# and actually restores THAT copy into the isolated `postgres` service container
# below (not Production, not the real R2 bucket). Only if that restore succeeds and
# its checksums match the real export does `run-production-backup.ts` mark the real
# manifest's `restoreVerified: true` before uploading the real (age-encrypted) artifact.
# See src/lib/reference-data/auto-update/run-production-backup.ts for the full
# rationale. Uploading a backup that has not passed this check is rejected by the
# existing `evaluatePutEncryptedBackupGates` (backup-r2-adapter.ts, unchanged).
# backup_category (2026-09-21 added): a fixed choice, not a free-text prefix. The
# category is the ONLY thing the human selects; prefix, manifest retentionCategory,
# and retentionDays are all derived from it in one place
# (src/lib/reference-data/auto-update/backup-category.ts) so they can never drift
# apart. Before this, the prefix was hardcoded to "daily/" in this file while the
# manifest's retentionCategory/retentionDays were separately hardcoded in
# run-production-backup-cli.ts to "production-standard"/8 — changing one without
# the other (e.g. to point a "permanent baseline" backup at pre-apply/) silently
# produced a manifest that claimed an 8-day expiry for a backup R2 will never
# delete. `default: pre-apply` reflects that the first-ever Production backup
# should be a permanent baseline, not a short-lived daily/weekly/monthly one — see
# the "Initial pre-apply Production backup" section of
# reference-data-production-backup-role-runbook.md before running this.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'backup' to confirm this manual run. This is not a substitute for the required GitHub Environment approval."
        required: true
        type: string
      backup_category:
        description: "Backup category. Determines the R2 prefix and retention metadata together (see backup-category.ts). Use pre-apply for the first-ever backup."
        required: true
        type: choice
        options:
          - pre-apply
          - daily
          - weekly
          - monthly
        default: pre-apply

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production-backup-approval
    timeout-minutes: 15
    # Isolated, ephemeral PostgreSQL for restore verification ONLY (see the header
    # comment above). This is NOT Production and NOT the real R2 bucket. It exists
    # only for this job's duration and is destroyed when the job ends. Credentials
    # here are throwaway, job-local values (not secrets) — same convention as the
    # "Reference data PostgreSQL validation" job in ci.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backup_verify_user
          POSTGRES_PASSWORD: backup_verify_password_ci_only
          POSTGRES_DB: backup_verify_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Reject unless the confirmation input is exactly "backup"
        if: ${{ inputs.confirm != 'backup' }}
        run: |
          echo "::error::confirmation input did not match 'backup'; aborting before touching any secret"
          exit 1

      # Defense in depth: the choice input's `options:` already stops the GitHub UI/API
      # from ever submitting a value outside these four, but this step re-checks with
      # the exact same strict, case-sensitive comparison before any secret is read,
      # in case this workflow is ever invoked a different way (e.g. repository_dispatch
      # from a future change, or the API directly).
      - name: Reject unless backup_category is exactly one of pre-apply/daily/weekly/monthly
        if: ${{ inputs.backup_category != 'pre-apply' && inputs.backup_category != 'daily' && inputs.backup_category != 'weekly' && inputs.backup_category != 'monthly' }}
        run: |
          echo "::error::backup_category must be exactly one of: pre-apply, daily, weekly, monthly"
          exit 1

      - name: Check required secrets are configured (fails before any DB or R2 connection)
        env:
          REFERENCE_DATA_BACKUP_DB_URL: ${{ secrets.REFERENCE_DATA_BACKUP_DB_URL }}
          REFERENCE_DATA_BACKUP_DB_CA_CERT: ${{ secrets.REFERENCE_DATA_BACKUP_DB_CA_CERT }}
          REFERENCE_DATA_BACKUP_AGE_RECIPIENT: ${{ secrets.REFERENCE_DATA_BACKUP_AGE_RECIPIENT }}
          REFERENCE_DATA_BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.REFERENCE_DATA_BACKUP_R2_ACCESS_KEY_ID }}
          REFERENCE_DATA_BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.REFERENCE_DATA_BACKUP_R2_SECRET_ACCESS_KEY }}
          REFERENCE_DATA_BACKUP_R2_ENDPOINT: ${{ secrets.REFERENCE_DATA_BACKUP_R2_ENDPOINT }}
          REFERENCE_DATA_BACKUP_R2_BUCKET: ${{ secrets.REFERENCE_DATA_BACKUP_R2_BUCKET }}
        run: |
          missing=0
          for name in REFERENCE_DATA_BACKUP_DB_URL REFERENCE_DATA_BACKUP_DB_CA_CERT REFERENCE_DATA_BACKUP_AGE_RECIPIENT REFERENCE_DATA_BACKUP_R2_ACCESS_KEY_ID REFERENCE_DATA_BACKUP_R2_SECRET_ACCESS_KEY REFERENCE_DATA_BACKUP_R2_ENDPOINT REFERENCE_DATA_BACKUP_R2_BUCKET; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::required secret not configured: $name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Production backup is blocked: required secrets are not configured. This is the expected, current state until a human explicitly provisions them (see reference-data-production-backup-credentials.md). Do not add a bypass here."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (reproducible, no new packages added by this workflow)
        run: npm ci

      - name: Install age (encryption CLI, not an npm package)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          age --version

      - name: Compile the backup execution entrypoint (tsc, no bundler, no new dependency)
        run: npx tsc -p tsconfig.backup-execution.json

      # 2026-09-21追記: 初回run #1が、Backup処理を一切開始する前に
      # "ReferenceError: exports is not defined in ES module scope"で失敗した
      # (repository package.jsonの"type": "module"と、tsc(module: CommonJS)が
      # 生成した.jsの不一致)。この修正はscripts/run-production-backup-entry.mjs
      # 自身がdist-backup-execution/package.jsonを都度書き出す形で行ったが、
      # 万一この修正が将来のリファクタで失われても、実Secretへ到達する前に
      # 必ず検出できるよう、実Secretを一切渡さない(空文字で明示的に上書きする)
      # 状態でこのステップ自体を実行し、module読み込みが成功することと、
      # 「Secret不足でblocked」という想定どおりのメッセージになることを確認する。
      - name: "Runtime smoke test (module load check, no real secrets used — regression test for the first workflow run's failure)"
        env:
          REFERENCE_DATA_BACKUP_DB_URL: ""
          REFERENCE_DATA_BACKUP_DB_CA_CERT: ""
          REFERENCE_DATA_BACKUP_AGE_RECIPIENT: ""
          REFERENCE_DATA_BACKUP_R2_ACCESS_KEY_ID: ""
          REFERENCE_DATA_BACKUP_R2_SECRET_ACCESS_KEY: ""
          REFERENCE_DATA_BACKUP_R2_ENDPOINT: ""
          REFERENCE_DATA_BACKUP_R2_BUCKET: ""
          REFERENCE_DATA_BACKUP_CATEGORY: ""
        run: |
          set +e
          output=$(node scripts/run-production-backup-entry.mjs 2>&1)
          code=$?
          set -e
          echo "$output"
          if echo "$output" | grep -qiE "is not defined in ES module scope|Cannot find module|ERR_MODULE_NOT_FOUND|require is not defined"; then
            echo "::error::compiled backup execution entrypoint failed to load (module-system mismatch reintroduced)"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "::error::runtime smoke test should have blocked without secrets, but exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "必須環境変数が不足している"; then
            echo "::error::expected a missing-secret blocked message, got something else"
            exit 1
          fi
          echo "runtime smoke test passed: module loaded correctly and was blocked before any DB/R2 connection"

      - name: Run Production backup (preflight, export, manifest, encryption, plaintext cleanup, isolated restore verification, R2 upload, remote checksum verification, audit summary)
        id: run_backup
        env:
          REFERENCE_DATA_BACKUP_DB_URL: ${{ secrets.REFERENCE_DATA_BACKUP_DB_URL }}
          REFERENCE_DATA_BACKUP_DB_CA_CERT: ${{ secrets.REFERENCE_DATA_BACKUP_DB_CA_CERT }}
          REFERENCE_DATA_BACKUP_AGE_RECIPIENT: ${{ secrets.REFERENCE_DATA_BACKUP_AGE_RECIPIENT }}
          REFERENCE_DATA_BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.REFERENCE_DATA_BACKUP_R2_ACCESS_KEY_ID }}
          REFERENCE_DATA_BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.REFERENCE_DATA_BACKUP_R2_SECRET_ACCESS_KEY }}
          REFERENCE_DATA_BACKUP_R2_ENDPOINT: ${{ secrets.REFERENCE_DATA_BACKUP_R2_ENDPOINT }}
          REFERENCE_DATA_BACKUP_R2_BUCKET: ${{ secrets.REFERENCE_DATA_BACKUP_R2_BUCKET }}
          REFERENCE_DATA_BACKUP_CATEGORY: ${{ inputs.backup_category }}
          BACKUP_VERIFY_PG_HOST: localhost
          BACKUP_VERIFY_PG_PORT: "5432"
          BACKUP_VERIFY_PG_USER: backup_verify_user
          BACKUP_VERIFY_PG_PASSWORD: backup_verify_password_ci_only
          BACKUP_VERIFY_PG_DATABASE: backup_verify_db
        run: node scripts/run-production-backup-entry.mjs

      # `run-production-backup-cli.ts` deletes its own plaintext temp file immediately
      # after encryption (and fails the job if that deletion itself fails — see
      # AgeCliEncryptor in backup-age-cli-encryptor.ts). This step is a second,
      # independent check: if anything named like a plaintext backup temp file is
      # still present in the runner's temp directory when the job ends, fail loudly
      # rather than silently letting the runner's own teardown discard it unnoticed.
      - name: Final cleanup verification (fails if a plaintext temp file was left behind)
        if: always()
        run: |
          leftover=$(find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -name 'backup-plaintext-*.tmp' 2>/dev/null || true)
          if [ -n "$leftover" ]; then
            echo "::error::plaintext backup temp file(s) left behind at job end: $leftover"
            exit 1
          fi
          echo "no leftover plaintext backup temp files found"
