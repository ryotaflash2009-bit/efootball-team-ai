name: Reference data update detection
# This name is referenced by workflow_run in the notify and orchestrator workflows. GitHub treats those values as
# filter patterns, so the name must not contain * ? + [ ] or !. The former name contained "+" and never matched,
# so neither follow-up workflow had ever run (found and fixed 2026-10-02).

# Automatic update DETECTION only (no Secrets, no Environment, no Production connection).
#
# - Triggers: hourly schedule at minute 17 (owner decision 2026-10-04: check every hour, 24 times a day; previously weekly
#   since 2026-09-25) and workflow_dispatch with confirm "detect".
#   Every scheduled run compares managers.json fully (1 request) and fetches one World search page (1 request) as a
#   light signal. The full World scan (~445 requests) runs only when that signal changes, when the last full scan is
#   6 hours old, after a failed full scan (2-hour backoff), or on a manual run (update-detection-light.ts). A light run
#   never claims "no change" for World (decision "not_scanned", overall "no_change_light").
#   State (signal, last full scan time, last reported candidates) is kept in the Actions cache: public summaries only,
#   no Secrets; if it is lost the next run simply does a full scan.
#   This is the ONLY workflow with a schedule; Backup, apply, rollback and Restore are never scheduled.
# - Both triggers pass the same gate: the job is skipped unless the repository variable
#   REFERENCE_DATA_AUTO_UPDATE_DETECTION_ENABLED is exactly "true" (unset, "false", "True" → skipped, 0 requests);
#   the CLI re-checks the variable and the trigger (schedule, or workflow_dispatch + "detect") before any request.
# - What it does: fetch the World catalogue once (caps in stage4-world.ts) and managers.json once, normalise,
#   and compare source checksums/counts/timestamps with docs/production-readiness/reference-data-applied-state.json.
#   Output: a non-secret summary (no_change / update_available / attention_required); no page bodies are stored.
#   It also uploads the F-071 base-ability distribution candidate (value counts per stat; aggregates only).
#   attention_required or a stopped fetch fails the job (the owner gets GitHub's failure notification).
# - It never runs plan/dry-run/apply against Production, Backup, rollback or Restore, never updates the
#   applied-state record, never commits or opens PRs (contents: read only); those stay owner-approved steps.

on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17 (avoids the top-of-hour peak; UTC/JST makes no difference hourly)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'detect' to run a manual detection (upstream only; no Production, no Backup, no apply)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reference-data-update-detection
  cancel-in-progress: false

jobs:
  detect:
    # Runs only when the owner enabled the variable AND (a scheduled run, once a schedule is approved, or a manual
    # run confirmed with exactly "detect"). Otherwise the job is skipped and no request is sent.
    if: ${{ vars.REFERENCE_DATA_AUTO_UPDATE_DETECTION_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.confirm == 'detect') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (reproducible, no new packages)
        run: npm ci

      - name: Compile the detection entrypoint (tsc, no bundler)
        run: npx tsc -p tsconfig.update-detection.json

      - name: Runtime smoke test (without the enable variable it must stop before any upstream request)
        env:
          REFERENCE_DATA_AUTO_UPDATE_DETECTION_ENABLED: ""
        run: |
          set +e
          output=$(node scripts/run-update-detection-entry.mjs 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ] || ! echo "$output" | grep -q '"not_enabled"' || ! echo "$output" | grep -q '"upstreamRequests": 0'; then
            echo "::error::detection entrypoint did not stop before upstream access when disabled"
            exit 1
          fi

      # Light-check state from the previous run (Actions cache; public summaries only). A missing cache means a full scan.
      - name: Restore the detection state
        uses: actions/cache/restore@v4
        with:
          path: .detection-state
          key: reference-data-detection-state-${{ github.run_id }}
          restore-keys: |
            reference-data-detection-state-

      - name: Detect upstream changes (no Secrets, no Production)
        env:
          REFERENCE_DATA_AUTO_UPDATE_DETECTION_ENABLED: ${{ vars.REFERENCE_DATA_AUTO_UPDATE_DETECTION_ENABLED }}
          REFERENCE_DATA_DETECTION_CONFIRM: ${{ inputs.confirm }}
          REFERENCE_DATA_DETECTION_SUMMARY_PATH: ${{ runner.temp }}/reference-data-detection-summary.json
          REFERENCE_DATA_DISTRIBUTION_PATH: ${{ runner.temp }}/world-base-distribution.candidate.json
          REFERENCE_DATA_DETECTION_STATE_PATH: .detection-state/world-light-state.json
          REFERENCE_DATA_DETECTION_CANDIDATES_PATH: .detection-state/candidates.json
        run: node scripts/run-update-detection-entry.mjs

      - name: Save the detection state
        # hashFiles() only sees files inside the workspace, so the state lives in .detection-state/ (not runner.temp).
        if: always() && hashFiles('.detection-state/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .detection-state
          key: reference-data-detection-state-${{ github.run_id }}

      # Non-secret summary only (counts, 12-character checksum prefixes, decisions, request statistics).
      - name: Upload the detection summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-data-detection-summary
          path: ${{ runner.temp }}/reference-data-detection-summary.json
          if-no-files-found: ignore
          # Hourly runs: keep summaries for 7 days (the orchestrator reads it within minutes; Evidence uses the run of an apply).
          retention-days: 7

      # F-071 candidate: per-stat value counts of base abilities (aggregates only; no names, IDs or URLs).
      # It reaches main only through the Evidence / applied-state PR after a verified Production apply
      # (or, with no upstream change, when its checksum equals the applied-state record). The UI uses it only
      # when its binding matches applied-state.
      - name: Upload the base-ability distribution candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: world-base-distribution-candidate
          path: ${{ runner.temp }}/world-base-distribution.candidate.json
          if-no-files-found: ignore
          retention-days: 30
